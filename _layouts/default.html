<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <ul>
          <li><a href="{{ '/' | relative_url }}">Inicio</a></li>
          <li><a href="{{ '/historia/' | relative_url }}">Historia</a></li>
          <li><a href="{{ '/archive/' | relative_url }}">Archivo</a></li>
          <li><a href="{{ '/about/' | relative_url }}">Acerca de</a></li>
        </ul>
      </nav>
    </div>
    <div class="container">
      <p class="site-tagline">{{ site.description }}</p>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>{{ site.title }} · Archivo histórico</span>
      <span>Generado con <a href="https://jekyllrb.com">Jekyll</a></span>
    </div>
  </footer>

</body>
</html>
